spring.application.name=petcare-api
server.port=8080

# ---------- H2 en memoria (por defecto, no requiere instalar nada) ----------
spring.datasource.url=jdbc:h2:mem:petcare;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Oracle (alternativa): comentar el bloque H2 y descomentar este ----------
#spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
#spring.datasource.username=TU_USUARIO
#spring.datasource.password=TU_CLAVE
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
#spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false
